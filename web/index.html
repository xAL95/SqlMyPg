    <!--
      THESIS: A modern desktop developer tool, executed as the convention rather than against it.
      The operator should recognise where everything is on first sight, and the craft should show in
      how legible and unhurried it is, not in refusing what this class of tool has settled on.
      OWN-WORLD: Layered blue-grey planes (light rendition: white canvas on a grey chrome plane).
      The system UI face carries everything operable; mono is confined to SQL in the editor and
      values in the grid. 14px interface, 13px data, 32px controls. Real radius (4px controls, 6-8px
      panels), real elevation with offset and soft spread. One blue accent, used as a fill for the
      single primary action and as a tint for selection; green committed, amber attention, red
      danger, nothing decorative.
      STORY: Someone who has used a database client before sits down and is productive without a
      tour; someone who has not can find every action as a labelled control.
      FIRST VIEWPORT: App bar with the mark, the active connection and the command line; schema tree
      left; one tab strip that also carries the active tab's own controls; the grid or editor
      directly beneath it; status rail along the bottom carrying backend pid, transaction state, row
      estimate and last timing as permanent annotations.
      FORM: Pinned by the brief. The user named the world (TablePlus / DataGrip / Supabase Studio)
      and the font problem, so convention is the commitment and no roll was dealt. Replaces the
      Dealing Desk direction (seed 36fa37b8), which this brief explicitly rejected.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
      the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
